id = "preferences"
trust = "first-party"
network = false
requires_sudo = false
writes = ["~/.config", "~/Library/Preferences"]
rollback = "partial"

[adapters.rcm]
path = "."

[adapters.nix-darwin]
path = "macos/nix-darwin.nix"
platforms = ["macos"]
requires_root = false
secrets = false
reboot_required = true

[adapters.home-manager]
path = "universal/home-manager.nix"
platforms = ["linux", "macos"]
requires_root = false
secrets = false
reboot_required = false

[adapters.nixos]
path = "universal/nixos.nix"
platforms = ["nixos"]
requires_root = false
secrets = false
reboot_required = false
