id = "universal"
trust = "first-party"
network = false
requires_sudo = false
writes = ["~/.config", "~/Library/Preferences"]
rollback = "partial"

[adapters.rcm]
path = "."

[adapters.home-manager]
path = "home-manager.nix"
platforms = ["linux", "macos"]
requires_root = false
secrets = false
reboot_required = false

[adapters.nixos]
path = "nixos.nix"
platforms = ["nixos"]
requires_root = false
secrets = false
reboot_required = false
